name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma client is needed for typecheck/test/build. No DB required to generate.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build must not touch a real DB (§10). A dummy URL satisfies the client.
          DATABASE_URL: postgresql://user:pass@localhost:5432/medic
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          ENCRYPTION_MASTER_KEY: ci-placeholder-key-not-used-at-runtime
